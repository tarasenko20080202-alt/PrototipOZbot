 <!doctype html>
  <html lang="ru">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0705">
  <meta name="color-scheme" content="dark">
  <title>WIWI · тату · поддержка · запись 24/7</title>
  <style>
  :root{
    box-sizing:border-box;
    --bg:#0a0705; --ink:#f3efe8; --muted:#8a8580; --muted2:#65605c; --hair:#252220; --hair2:#37332f;
    --cream:#efece6; --accent:#c2432c; --accent2:#e3963f; --green:#4fae72; --orange:#e0a23c; --red:#c2432c;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;width:100%;height:100%;background:var(--bg);}
  body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  button,input,textarea{font:inherit;color:inherit;}
  button{border:0;background:none;padding:0;cursor:pointer;}
  input,textarea{background:#000;border:0;outline:none;}
  input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid rgba(243,239,232,.5);outline-offset:2px;}
  a{color:inherit;text-decoration:none;}

  /* СТИЛИ ДЛЯ ВИДЕО-ФОНА */
  #bgVideo {
    position: fixed !important;
    right: 0;
    bottom: 0;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    z-index: -100 !important;
    object-fit: cover;
    pointer-events: none;
  }

  .app{position:relative;width:100%;height:100svh;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;}

  /* topbar */
  .topbar{flex:none;height:52px;padding:calc(env(safe-area-inset-top,0px)) 8px 0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid
  var(--hair);background:#080605;position:relative;z-index:30;}
  .tb-l{display:flex;align-items:center;gap:8px;min-width:0;}
  .tb-back{width:26px;height:26px;display:none;align-items:center;justify-content:center;font-size:18px;color:#c9c5c0;flex:none;}
  .tb-back.show{display:flex;}
  .tb-title{font-size:14px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tb-r{display:flex;align-items:center;gap:16px;flex:none;}
  .tb-icon{font-size:19px;color:#a9a5a0;width:20px;text-align:center;}

  /* generic screen */
  .screen{display:none;flex:1;overflow-y:auto;padding:0 0 100px;}
  .screen.active{display:block;}
  #scr-home.active{display:flex;flex-direction:column;overflow:hidden;padding-bottom:0;}

  /* ticker */
  .ticker{overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--hair);background:#070504;}
  .ticker b{display:inline-block;padding:6px 0;font:9px/1 "Courier New",monospace;font-weight:400;letter-spacing:2px;color:#5c5854;text-transform:uppercase;animation:tick 22s linear infinite;}

  @keyframes heroTextureMove{
    0%{background-position:46% 48%;background-size:112% 112%;}
    50%{background-position:54% 52%;background-size:118% 118%;}
    100%{background-position:49% 46%;background-size:114% 114%;}
  }
  .hero::after{
    content:"";
    position:absolute;
    inset:-8%;
    pointer-events:none;
    background:
      radial-gradient(circle at 28% 28%,rgba(255,255,255,.10),transparent 30%),
      radial-gradient(circle at 75% 70%,rgba(0,0,0,.28),transparent 48%),
      linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.34));
    mix-blend-mode:soft-light;
    animation:none; transform:none;
  }
  .hero>*:not(.hero-effect){z-index:1;}
  @media (prefers-reduced-motion:reduce){
    .hero,.hero::after{animation:none;}
  }

  @keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
