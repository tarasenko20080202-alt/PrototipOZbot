<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07090b">
<title>wiwi · тату · поддержка · запись 24/7</title>
<style>
:root{
  --bg:#080a0c;--panel:#0b0e10;--panel2:#0e1215;--line:rgba(255,255,255,.10);
  --muted:#777d83;--muted2:#5c6268;--text:#f1eee8;--cream:#eeeae4;--red:#ba3e32;
  --shadow:0 18px 50px rgba(0,0,0,.48);--ease:cubic-bezier(.2,.8,.2,1)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#030405;color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{display:grid;place-items:center;overflow:hidden}
button,input{font:inherit}
button{cursor:pointer}
.app{position:relative;width:min(100vw,720px);height:100svh;min-height:620px;overflow:hidden;background:linear-gradient(#080a0c,#080a0c);box-shadow:0 0 0 1px rgba(255,255,255,.05),0 26px 80px rgba(0,0,0,.6)}
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:linear-gradient(#080a0c,#06080a);border-bottom:1px solid #121619;position:relative;z-index:4}
.topbar-title{font-size:18px;font-weight:700;letter-spacing:-.45px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;align-items:center;gap:15px;color:#aeb3b7;margin-left:10px}
.action{width:22px;height:28px;display:grid;place-items:center;border:0;background:none;color:inherit;padding:0}
.dots{font-size:24px;line-height:20px;transform:translateY(-2px)}
.close{font-size:29px;font-weight:300;line-height:20px;transform:translateY(-1px)}

.hero{
  height:294px;
  position:relative;
  overflow:hidden;
  padding:39px 10px 13px;
  border-bottom:1px solid rgba(255,255,255,.12);
  isolation:isolate;
  background:
    radial-gradient(80% 72% at 18% 6%,rgba(187,79,40,.55) 0%,rgba(117,45,28,.38) 22%,transparent 66%),
    radial-gradient(72% 60% at 80% 0%,rgba(130,72,28,.58) 0%,rgba(86,45,21,.2) 36%,transparent 70%),
    linear-gradient(180deg,#3b2118 0%,#1d110e 33%,#0d0f11 70%,#0b0f12 100%)
}
.hero:before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(circle at 30% 20%,rgba(255,255,255,.08),transparent 24%),
    radial-gradient(circle at 70% 10%,rgba(255,255,255,.05),transparent 22%)
}
.dot-grid{
  position:absolute;
  inset:-10px;
  z-index:-1;
  opacity:.58;
  pointer-events:none;
  background-image:radial-gradient(rgba(239,211,194,.72) .68px,transparent .78px);
  background-size:6px 6px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.92) 0,rgba(0,0,0,.72) 42%,rgba(0,0,0,.23) 78%,transparent 100%)
}
.scanlines{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.08;
  background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(255,255,255,.2) 3px 4px);
  mix-blend-mode:screen
}
.corner{
  position:absolute;
  width:15px;
  height:15px;
  border-color:#d9d5cc;
  border-style:solid;
  opacity:.92
}
.corner.tl{left:5px;top:14px;border-width:2px 0 0 2px}
.corner.tr{right:15px;top:14px;border-width:2px 2px 0 0}

.eyebrow{
  position:relative;
  z-index:2;
  font:10px/1 "Courier New",monospace;
  letter-spacing:2.3px;
  color:#ece5df;
  text-transform:uppercase;
  margin-bottom:12px
}
.logo-wrap{
  position:relative;
  z-index:2;
  display:inline-block;
  transform:translateZ(0)
}
.logo{
  margin:0;
  font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;
  font-size:101px;
  line-height:.76;
  letter-spacing:-7px;
  color:#f3f0ea;
  text-transform:uppercase;
  font-weight:900;
  text-shadow:0 1px 0 rgba(255,255,255,.18),0 5px 15px rgba(0,0,0,.12)
}
.logo span{
  display:inline-block
}
.logo .dot{
  color:var(--red);
  font-size:.91em;
  letter-spacing:0;
  margin-left:1px;
  transform:translateY(1px)
}
.hero-copy{
  position:relative;
  z-index:2;
  margin-top:19px
}
.lead{
  margin:0;
  font-size:14px;
  line-height:1.43;
  color:#eeece8
}
.sub{
  display:block;
  color:#7f858a
}

.menu{background:var(--panel)}
.row{
  height:48px;
  display:flex;
  align-items:center;
  padding:0 6px;
  border-bottom:1px solid var(--line);
  font-weight:700;
  font-size:15px;
  position:relative;
  overflow:hidden;
  transition:background .18s var(--ease),padding .18s var(--ease)
}
.row:active{
  background:#111518;
  padding-left:9px
}
.row:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:2px;
  background:var(--red);
  transform:scaleY(0);
  transform-origin:center;
  transition:transform .18s var(--ease)
}
.row:active:before{transform:scaleY(1)}
.label{white-space:nowrap}
.leader{
  flex:1;
  margin:0 10px;
  border-bottom:1px dotted #353b40;
  transform:translateY(1px);
  opacity:.95
}
.hint{
  font:9px/1 "Courier New",monospace;
  letter-spacing:2px;
  color:#70777d;
  text-transform:uppercase;
  white-space:nowrap
}
.arrow{
  font-size:14px;
  color:#71777c;
  margin-left:5px;
  transform:translateY(-1px)
}
.footerline{
  height:71px;
  padding:26px 7px 0;
  font:10px/1 "Courier New",monospace;
  letter-spacing:2px;
  color:#61676d;
  text-transform:uppercase
}
.cta-wrap{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:63px;
  padding:11px 1px 0;
  z-index:6;
  background:linear-gradient(180deg,rgba(8,10,12,0),rgba(8,10,12,.97) 18%,#080a0c 100%)
}
.cta{
  position:relative;
  width:100%;
  height:39px;
  border:1px solid #dad7d2;
  border-radius:6px;
  background:var(--cream);
  color:#08090a;
  font-size:12px;
  font-weight:500;
  letter-spacing:.15px;
  transition:transform .12s ease,filter .12s ease,box-shadow .2s ease
}
.cta:active{
  transform:translateY(1px);
  filter:brightness(.92)
}
.cta:after{
  content:"";
  position:absolute;
  left:18px;
  right:18px;
  bottom:-4px;
  height:1px;
  background:rgba(238,234,228,.16);
  filter:blur(3px)
}

.backdrop{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.54);
  opacity:0;
  pointer-events:none;
  z-index:8;
  transition:opacity .28s ease
}
.backdrop.open{
  opacity:1;
  pointer-events:auto
}
.sheet{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:9;
  background:linear-gradient(#111519,#0b0e11);
  border-top:1px solid #343b40;
  border-radius:15px 15px 0 0;
  box-shadow:var(--shadow);
  transform:translateY(105%);
  transition:transform .34s var(--ease);
  padding:10px 14px calc(16px + env(safe-area-inset-bottom));
  max-height:76svh;
  overflow:auto
}
.sheet.open{transform:translateY(0)}
.grabber{
  width:44px;
  height:4px;
  border-radius:5px;
  background:#454b50;
  margin:0 auto 14px
}
.sheet h2{
  font-size:20px;
  line-height:1.15;
  margin:0 0 7px
}
.sheet p{
  font-size:13px;
  line-height:1.45;
  color:#b5babd;
  margin:0 0 12px
}
.sheet-close{
  position:absolute;
  right:10px;
  top:8px;
  width:34px;
  height:34px;
  border:0;
  background:none;
  color:#b7bdc0;
  font-size:26px
}
.field{
  width:100%;
  height:44px;
  margin:8px 0;
  border:1px solid #343a3e;
  border-radius:6px;
  background:#080b0e;
  color:#f0efec;
  padding:0 12px;
  outline:none
}
.field:focus{border-color:#626a70}
.submit{
  width:100%;
  height:44px;
  margin-top:8px;
  border:0;
  border-radius:6px;
  background:var(--cream);
  color:#101112;
  font-size:12px;
  font-weight:700
}
.status{
  display:none;
  margin-top:10px;
  font:10px/1.3 "Courier New",monospace;
  letter-spacing:1px;
  text-transform:uppercase;
  color:#7e858b
}
.status.show{display:block}

.toast{
  position:absolute;
  left:50%;
  bottom:76px;
  z-index:20;
  transform:translate(-50%,14px);
  opacity:0;
  pointer-events:none;
  background:#15191d;
  border:1px solid #31373b;
  color:#eeeae5;
  padding:10px 14px;
  border-radius:8px;
  font-size:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
  transition:opacity .2s ease,transform .2s var(--ease);
  white-space:nowrap
}
.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}

@media(max-width:520px){
  .topbar{font-size:17px}
  .hero{height:292px;padding-top:36px}
  .logo{font-size:86px;letter-spacing:-6px}
  .row{height:47px}
  .hint{font-size:8px;letter-spacing:1.6px}
}
@media(max-width:360px){
  .topbar-title{font-size:15px}
  .logo{font-size:74px}
  .hero-copy{margin-top:15px}
  .lead{font-size:13px}
  .row{font-size:14px}
  .hint{display:none}
  .leader{margin-right:7px}
}
</style>
</head>

<body>
<main class="app" id="app">

<header class="topbar">
  <div class="topbar-title">wiwi · тату · поддержка · запись 24/7</div>

  <div class="actions">
    <button class="action dots" id="more" aria-label="Меню">⋮</button>
    <button class="action close" id="pageClose" aria-label="Закрыть">×</button>
  </div>
</header>

<section class="hero">
  <div class="dot-grid"></div>
  <div class="scanlines"></div>

  <span class="corner tl"></span>
  <span class="corner tr"></span>

  <div class="eyebrow">WIWI / TATTOO</div>

  <div class="logo-wrap">
    <h1 class="logo">
      WI<br>
      WI<span class="dot">.</span>
    </h1>
  </div>

  <div class="hero-copy">
    <p class="lead">
      Блэкворк, орнамент, тонкая линия.
      <span class="sub">Эскиз под тебя, не с листа.</span>
    </p>
  </div>
</section>

<nav class="menu" aria-label="Разделы">

  <button class="row"
    data-title="Работы"
    data-body="Портфолио мастера, стилистика и свежие работы.">
    <span class="label">работы</span>
    <span class="leader"></span>
    <span class="hint">ПОРТФОЛИО</span>
    <span class="arrow">›</span>
  </button>

  <button class="row"
    data-title="Уход за тату"
    data-body="Памятка по уходу: первые дни, что нормально и когда писать мастеру.">
    <span class="label">уход за тату</span>
    <span class="leader"></span>
    <span class="hint">ПАМЯТКА</span>
    <span class="arrow">›</span>
  </button>

  <button class="row"
    data-title="Вопросы"
    data-body="Как проходит сеанс, что подготовить и как согласуется эскиз.">
    <span class="label">вопросы</span>
    <span class="leader"></span>
    <span class="hint">КАК ВСЁ УСТРОЕНО</span>
    <span class="arrow">›</span>
  </button>

  <button class="row"
    data-title="Мои записи"
    data-body="Проверь статус заявки или открой сохранённые записи.">
    <span class="label">мои записи</span>
    <span class="leader"></span>
    <span class="hint">СТАТУСЫ</span>
    <span class="arrow">›</span>
  </button>

  <button class="row"
    data-title="Написать мастеру"
    data-body="Свяжись с мастером напрямую по поводу идеи, эскиза или даты.">
    <span class="label">написать мастеру</span>
    <span class="leader"></span>
    <span class="hint">@WIWI</span>
    <span class="arrow">›</span>
  </button>

</nav>

<div class="footerline">
  КАЛИНИНГРАД · СЕАНСЫ ПО ЗАПИСИ
</div>

<div class="cta-wrap">
  <button class="cta" id="cta">ЗАПИСАТЬСЯ</button>
</div>

<div class="backdrop" id="backdrop"></div>

<aside class="sheet" id="sheet" aria-hidden="true">
  <div class="grabber"></div>

  <button class="sheet-close" id="sheetClose" aria-label="Закрыть">×</button>

  <h2 id="sheetTitle">Запись</h2>

  <p id="sheetBody">
    Оставь данные — ответим в чате и согласуем дату.
  </p>

  <input
    class="field"
    id="name"
    autocomplete="name"
    placeholder="Имя"
  >

  <input
    class="field"
    id="contact"
    autocomplete="tel"
    placeholder="Контакт"
  >

  <button class="submit" id="submit">
    ОТПРАВИТЬ
  </button>

  <div class="status" id="status">
    Заявка подготовлена · можно передать мастеру
  </div>
</aside>

<div class="toast" id="toast">
  Раздел открыт
</div>

</main>

<script>
const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('backdrop');
const toast = document.getElementById('toast');

const title = document.getElementById('sheetTitle');
const body = document.getElementById('sheetBody');
const status = document.getElementById('status');

function openSheet(
  t = 'Запись',
  b = 'Оставь данные — ответим в чате и согласуем дату.'
){
  title.textContent = t;
  body.textContent = b;

  status.classList.remove('show');

  sheet.classList.add('open');
  backdrop.classList.add('open');

  sheet.setAttribute('aria-hidden','false');
}

function closeSheet(){
  sheet.classList.remove('open');
  backdrop.classList.remove('open');

  sheet.setAttribute('aria-hidden','true');
}

function showToast(text){
  toast.textContent = text;
  toast.classList.add('show');

  clearTimeout(window.__toast);

  window.__toast = setTimeout(
    () => toast.classList.remove('show'),
    1400
  );
}

document
  .getElementById('cta')
  .addEventListener('click', () => openSheet());

document
  .getElementById('sheetClose')
  .addEventListener('click', closeSheet);

backdrop.addEventListener('click', closeSheet);

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    closeSheet();
  }
});

document.querySelectorAll('.row').forEach(row => {
  row.addEventListener('click', () => {
    openSheet(
      row.dataset.title,
      row.dataset.body
    );
  });
});

document.getElementById('submit').addEventListener('click', () => {

  const n = document.getElementById('name').value.trim();
  const c = document.getElementById('contact').value.trim();

  if(!n || !c){
    showToast('Заполни имя и контакт');
    return;
  }

  status.classList.add('show');
  showToast('Готово');
});

document
  .getElementById('more')
  .addEventListener('click', () => showToast('Меню'));

document
  .getElementById('pageClose')
  .addEventListener('click', () => showToast('Закрытие'));
</script>

</body>
</html>
